* {

html, body {

body {

/* ===== HEADER ===== */

    font-weight: bold;
    transition: transform 0.2s, color 0.2s;
}

/* Анимация наведения на MG */
.home:hover {
    color: #4caf50;
    transform: scale(1.05);
}

.nav-icons {
    flex: 1;
    display: flex;
    justify-content: center;

}

.nav-icons a {
    color: #aaa;
    font-size: 14px;
    text-decoration: none;
    transition: color 0.2s, transform 0.2s;
}

/* Анимация наведения на иконки */

}

}

.logout-btn {

    font-size: 13px;
}

.popup {

<script>
// ===== Проверка авторизации =====
if(localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'index.html';
}
document.getElementById('logout').addEventListener('click', ()=>{
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
});

// ===== ДАННЫЕ =====
const specialists = [""];
const institutions = [""];
const devices = [""];

const today = new Date().toISOString().slice(0, 10);
document.getElementById("dateFilterProblems").value = today;

document.getElementById('reloadButton').addEventListener('click', ()=>{window.location.reload()})

function getFacilities() {
    const url = `https://docs.google.com/spreadsheets/d/16ABEN54Ykbej-PhrbBjGlaHSXzNbD4PA8ecbpWc5QHQ/gviz/tq?gid=178416067`;
    fetch(url)
    .then(res => res.text())
    .then(rep => {
        const data2 = JSON.parse(rep.substr(47).slice(0,-2));
        const length = data2.table.rows.length;
        for (let i=1; i<length; i+=1) {
            if(data2.table.rows[i].c[0] && data2.table.rows[i].c[0].v != null) institutions.push(data2.table.rows[i].c[0].v);
            if(data2.table.rows[i].c[1] && data2.table.rows[i].c[1].v != null) devices.push(data2.table.rows[i].c[1].v);
        }
        fillSelect('filterInstitution', institutions);
        fillSelect('filterDevice', devices);
    })
}
// window.onload = getFacilities();



const place = [];
const machine = [];
const sn = [];
const installDate = [];
const status = [];
let arr = [];
let arrFiltered = [];
let history = [];
function getListVisits() {
    const url = `https://docs.google.com/spreadsheets/d/16ABEN54Ykbej-PhrbBjGlaHSXzNbD4PA8ecbpWc5QHQ/gviz/tq?gid=369401196`;
    fetch(url)
    .then(res => res.text())
    .then(rep => {
        const data2 = JSON.parse(rep.substr(47).slice(0,-2));
        let data3=data2.table.rows;
        for (let i=0; i<data3.length; i+=1) {
            arr.push({
                facility: (data3[i].c[1] && data3[i].c[1].v != null) ? data3[i].c[1].v : '',
                device: (data3[i].c[3] && data3[i].c[3].v != null) ? data3[i].c[3].v : '',
                sn: (data3[i].c[4] && data3[i].c[4].v != null) ? data3[i].c[4].v : '',
                installDate: (data3[i].c[2] && data3[i].c[2].v != null) ? data3[i].c[2].v : '',
                toDate:  (data3[i].c[6] && data3[i].c[6].v != null) ? data3[i].c[6].v : '', 
                status: (data3[i].c[5] && data3[i].c[5].v != null) ? data3[i].c[5].v : '',
            });
        }
        arrFiltered = arr.filter(e=>e.status != "Н/А");
        return arr
        // console.log(arr);
        // console.log(arr.filter(e=>e.status != "Н/А"));
        // renderTable(arr.filter(e=>e.status != "Н/А"));
    })
}

function getDevicesHistory() {
    const url = `https://docs.google.com/spreadsheets/d/16ABEN54Ykbej-PhrbBjGlaHSXzNbD4PA8ecbpWc5QHQ/gviz/tq?gid=440589172`;
    fetch(url)
    .then(res => res.text())
    .then(rep => {
        const data2 = JSON.parse(rep.substr(47).slice(0,-2));
        let data3=data2.table.rows;
        for (let i=0; i<data3.length; i+=1) {
            history.push({
                facility: (data3[i].c[0] && data3[i].c[0].v != null) ? data3[i].c[0].v : '',
                device: (data3[i].c[1] && data3[i].c[1].v != null) ? data3[i].c[1].v : '',
                sn: (data3[i].c[2] && data3[i].c[2].v != null) ? data3[i].c[2].v : '',
                changeDate: (data3[i].c[3] && data3[i].c[3].v != null) ? data3[i].c[3].v : '',
                deviceStatus:  (data3[i].c[4] && data3[i].c[4].v != null) ? data3[i].c[4].v : '', 
                statusInfo: (data3[i].c[5] && data3[i].c[5].v != null) ? data3[i].c[5].v : '',
            });
        }
    })
}

function getAllImportantInfo() {
    getListVisits();
    getFacilities();
    getDevicesHistory();
    setTimeout(()=>{renderTable(arrFiltered,history)},2500)
}

function buildHistoryMap(history) {
  const map = {};

  history.forEach(item => {
    map[item.sn] = item; // перезаписываем → остаётся последняя
  });

  return map;
}

// ===== Заполнение селектов =====
function fillSelect(id, array){
    const sel = document.getElementById(id);
    array.forEach(val=>{
        const opt = document.createElement('option');
        opt.value=val;
        opt.textContent=val;
        sel.appendChild(opt);
    });
}


// ===== Таблица =====
// const tbody = document.querySelector('#visitTable tbody');
const statusOptions = [
  "В работе",
  "В работе, мониторинг проблемы",
  "В работе, ждет ремонта",
  "В работе, задача на ТО",
  "В работе, мониторинг после ремонта",
  "В работе, требуется обновление",
  "В работе, требуется перемещение",
  "Не в работе",
  "Не в работе, ждет ремонта",
  "Не в работе, ждет замены прибора",
  "Законсервирован",
  "Законсервирован, ждет вывоза",
  "Законсервирован, ждет реагентов",
  "У клиента, не запущен",
  "Перемещен на склад",
  "Другое"
];

function renderTable(devices, history) {
  const tbody = document.querySelector("#deviceTable tbody");
  tbody.innerHTML = "";

  const historyMap = buildHistoryMap(history);
  devices.forEach((item, index) => {
    const h = historyMap[item.sn] || {};

    const tr = document.createElement("tr");
    if (h[h.length-1]) {
      let colorCode = (statusOptions.indexOf(h[h.length-1].deviceStatus) == 7 || statusOptions.indexOf(h[h.length-1].deviceStatus) == 8|| statusOptions.indexOf(h[h.length-1].deviceStatus) == 9)? 'code_1' : (statusOptions.indexOf(h[h.length-1].deviceStatus) == 2? 'code_2' : "");
      tr.className = colorCode;
    }
    // if(index == 0) console.log(h[h.length-1].facility, h[h.length-1].deviceStatus,h[h.length-1].statusInfo)
    tr.innerHTML = `
      <td class="col-id">${index + 1}</td>
      <td class="col-facility">${item.facility}</td>
      <td class="col-device">${item.device}</td>
      <td class="col-sn">${item.sn}</td>
      <td class="col-install">${item.installDate}</td>
      <td class="col-status">${!h[h.length-1]? "В работе" : h[h.length-1].deviceStatus}</td>
      <td class="col-todate">${item.toDate}</td>
      <td class="col-lasttext">${h[h.length-1]? h[h.length-1].statusInfo : ""}</td>
      <td class="col-buttons">
        <button title="История" onclick="openHistory('${item.sn}')"">
            <i class="fa-solid fa-clipboard-list"></i>
        </button>
        <button title="Добавить" onclick="openAddPopup('${item.sn}')"">
            <i class="fa-solid fa-square-plus"></i>
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

function createStatusSelect(selectedStatus) {
  return `
    <select>
      ${statusOptions.map(opt => `
        <option value="${opt}" ${opt === selectedStatus ? "selected" : ""}>
          ${opt}
        </option>
      `).join("")}
    </select>
  `;
}


// ===== ФИЛЬТРАЦИЯ =====
const filterInstitution = document.getElementById('filterInstitution');
const filterDevice = document.getElementById('filterDevice');
const snInput = document.getElementById('snInput');
function filterTable() {
  const i = filterInstitution.value;
  const d = filterDevice.value;
  const s = snInput.value.trim().toLowerCase();

  const filtered = arr
    .filter(e => e.status !== "Н/А")
    .filter(r => {
      return (!i || r.facility === i)
        && (!d || r.device === d)
        && (!s || String(r.sn).toLowerCase().includes(s));
    });

  renderTable(filtered, history);
}
snInput.addEventListener('input', filterTable);
filterInstitution.addEventListener('change', filterTable);
filterDevice.addEventListener('change', filterTable);

function changeDate(str) {
    if(str) return new Date(str.split('Date(')[1].split(')')[0].split(',')[0],str.split('Date(')[1].split(')')[0].split(',')[1],str.split('Date(')[1].split(')')[0].split(',')[2]).toLocaleString('ru-RU', {year: 'numeric', month: '2-digit', day: '2-digit'})
}

function countDate(str) {
    if(str) return Number(str.split('Date(')[1].split(')')[0].split(',')[0])*10000 + Number(str.split('Date(')[1].split(')')[0].split(',')[1])*100 +Number(str.split('Date(')[1].split(')')[0].split(',')[2])
}

function dateDiff(dateStr1, dateStr2) {
  const parse = str => {
    if (str) {
      const [, y, m, d] = str.match(/Date\((\d+),\s*(\d+),\s*(\d+)\)/);
      return new Date(+y, +m, +d);
    } else {
      return new Date(2000,0,1);
    }
    
  };

  const d1 = parse(dateStr1);
  const d2 = parse(dateStr2);

  const diffMs = (d2 - d1);
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

    for (const facility in grouped) {
        html += `<div class="history-block">

        html += `

        });

}

function toDateString(str) {
  const [y, m, d] = str.split("-");
  return `Date(${y},${Number(m) - 1},${d})`;
}
document.getElementById("dateFilterProblems").addEventListener('change', openProblems);

function filterNotWorkingAfterWorkingBySn(historyMap) {
  const result = {};

  for (const [sn, records] of Object.entries(historyMap)) {
    let lastWorkingIndex = -1;
    records.forEach((r, i) => {
      if (r.deviceStatus === "В работе"||r.deviceStatus === "В работе, мониторинг проблемы") {
        lastWorkingIndex = i;
      }
    });
    const lastRecord = records[records.length - 1];
    if (lastRecord.deviceStatus !== "Не в работе"&&lastRecord.deviceStatus !== "Не в работе, ждет ремонта"&&lastRecord.deviceStatus !== "Не в работе, ждет замены прибора") continue;
    const filtered = records.filter(
      (r, i) =>
        (r.deviceStatus==="Не в работе"||r.deviceStatus==="Не в работе, ждет ремонта"||r.deviceStatus==="Не в работе, ждет замены прибора") &&
        i > lastWorkingIndex
    );

    if (filtered.length) {
      result[sn] = filtered;
    }
  }
  return result;
}

let historyMap;
function buildHistoryMap(history) {
  return history.reduce((acc, item) => {
    acc[item.sn] ??= [];
    acc[item.sn].push(item);
    return acc;
  }, {});
}

function validateAddForm() {
  const select = document.getElementById("addStatusSelect");
  const textarea = document.getElementById("addComment");
  const submitBtn = document.getElementById("addSubmitBtn");

  submitBtn.disabled = !select.value || !textarea.value.trim();
}

document.getElementById("addStatusSelect")
  .addEventListener("change", validateAddForm);

document.getElementById("addComment")
  .addEventListener("input", validateAddForm);

document.getElementById("addSubmitBtn").addEventListener("click", () => {
  if (!currentAddContext) return;

  const status = document.getElementById("addStatusSelect").value;
  const text = document.getElementById("addComment").value.trim();

  if (!status || !text) return;

  const now = new Date();
  const date =
    String(now.getDate()).padStart(2, "0") + "." +
    String(now.getMonth() + 1).padStart(2, "0") + "." +
    now.getFullYear();

  const result = {
    facility: currentAddContext.facility,
    device: currentAddContext.device,
    sn: currentAddContext.sn,
    toDate: date,
    currentStatus: status,
    lastText: text
  };
  fetch("https://script.google.com/macros/s/AKfycbzrvsmKW7acX0S5xIDv0g_4n0IXdBJFxa-79IeEICOYNmcWSNJjyrNu0O-uWkXr9OPu/exec", {
  method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "data=" + encodeURIComponent(JSON.stringify(result))
  })
  closeAddPopup();
  setTimeout(()=>{window.location.reload()},2500)
});
