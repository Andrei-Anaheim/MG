<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MG – Выезды</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Иконки (Font Awesome) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

html, body {
    height: 100%;
}

body {
    display: flex;
    flex-direction: column;
    background: #f3f3f3;
}

/* ===== HEADER ===== */
header {
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 10px 12px;
    gap: 8px;
    flex-shrink: 0;
}

.header-left,
.header-right {
    flex: 0 0 auto;
}

.home {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    transition: transform 0.2s, color 0.2s;
}

/* Анимация наведения на MG */
.home:hover {
    color: #4caf50;
    transform: scale(1.05);
}

.nav-icons {
    flex: 1;
    display: flex;
    justify-content: center;
    gap: 4%; /* увеличено расстояние между иконками на ПК */
}

.nav-icons a {
    color: #aaa;
    font-size: 14px;
    text-decoration: none;
    transition: color 0.2s, transform 0.2s;
}

/* Анимация наведения на иконки */
.nav-icons a:hover {
    color: #4caf50;
    transform: scale(1.2);
}

.nav-icons a.active {
    color: #4caf50;
    transform: scale(1.2);
}

.logout-btn {
    padding: 8px 14px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}

/* ===== MAIN ===== */
main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between; /* кнопки растягиваются по высоте */
    padding: 10px 10px 12px 10px; /* небольшой отступ сверху и снизу */
    gap: 8px; /* уменьшено расстояние между кнопками */
}

/* ===== TILE ===== */
.tile {
    position: relative;
    width: 95%;
    display: block;
    text-decoration: none;
    color: #fff;
    border-radius: 16px;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    height: 47%; /* чуть увеличено, чтобы кнопки занимали больше места */
}

.tile::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
}

.tile span {
    position: relative;
    z-index: 1;
    display: block;
    padding: 16px;
    font-size: 22px;
    font-weight: bold;
}

/* ===== ПК ===== */
@media (min-width: 900px) {
    header {
        height: 80px;
        padding: 0 20px;
    }

    .nav-icons {
        gap: 76px; /* увеличено расстояние между иконками */
    }

    .nav-icons a {
        font-size: 22px;
    }

    main {
        flex-direction: row;
        justify-content: space-between;
        align-items: stretch;
        padding: 24px;
        gap: 24px;
        height: calc(100vh - 80px);
    }

    .tile {
        width: 49%; /* две кнопки слева и справа */
        height: 100%; /* ПК версии оставляем как было */
    }

    .tile span {
        font-size: 32px;
    }
}

/* ===== ФОНЫ ===== */
.add {
    background-image: url("assets/img/button8.jpg");
}

.list {
    background-image: url("assets/img/button7.jpg");
}

    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="start.html" class="home">
            <i class="fa-solid fa-house"></i>
            MG
        </a>
    </div>

    <nav class="nav-icons">
        <a href="visit.html" class="active"><i class="fa-solid fa-car"></i></a>
        <a href="calc.html"><i class="fa-solid fa-calculator"></i></a>
        <a href="generator.html"><i class="fa-solid fa-key"></i></a>
        <a href="barcode.html"><i class="fa-solid fa-barcode"></i></a>
        <a href="map.html"><i class="fa-solid fa-globe"></i></a>
        <a href="analyzers.html"><i class="fa-solid fa-book"></i></a>
        <a href="error.html"><i class="fa-solid fa-triangle-exclamation"></i></a>
        <a href="calendar.html"><i class="fa-regular fa-calendar"></i></a>
        <a href="devices.html"><i class="fa-solid fa-computer"></i></a>
    </nav>

    <div class="header-right">
        <button class="logout-btn" id="logout">Выход</button>
    </div>
</header>

<main>
    <a href="addvisit.html" class="tile add">
        <span>Добавить выезд</span>
    </a>

    <a href="list.html" class="tile list">
        <span>Журнал выездов</span>
    </a>
</main>

<script>
    // Проверка авторизации
    if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "index.html";
    }

    // Выход
    document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("user");
        window.location.href = "index.html";
    });
</script>

</body>
</html>
