<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Иконки (Font Awesome) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background: #111;
    color: #fff;
}

/* ===== HEADER ===== */
header {
            background: #111;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 10px 12px;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-left,
        .header-right {
            flex: 0 0 auto;
        }

        .home {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.2s, color 0.2s;
        }

        .home:hover {
            color: #4caf50;
            transform: scale(1.05);
        }

        .nav-icons {
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 4%;;
        }

        .nav-icons a {
            color: #aaa;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
        }

        .nav-icons a:hover {
            color: #4caf50;
            transform: scale(1.2);
        }

        .nav-icons a.active {
            color: #4caf50;
            transform: scale(1.2);
        }

        .logout-btn {
            padding: 8px 14px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }


/* ===== MAIN ===== */
main {
    min-height: calc(100vh - 80px);
    padding: 32px 16px;
}

/* ===== FORM ===== */
.error-form {
    max-width: 900px;
    margin: 0 auto 32px;
    background: rgba(0, 0, 0, 0.75);
    padding: 24px;
    border-radius: 16px;
    display: grid;
    gap: 16px;
}

.error-form input,
.error-form select {
    height: 44px;
    padding: 0 14px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

.error-form button {
    height: 48px;
    background: #e74c3c;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.error-form button:hover {
    background: #c0392b;
}

/* ===== ERRORS ===== */
.errors-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    display: none;
}

.error-card {
    background: rgba(0, 0, 0, 0.75);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    display: grid;
    gap: 8px;
}

.error-card p {
    line-height: 1.4;
}

.error-card p strong {
    color: #e74c3c;
}

.red_status {
    color:#e74c3c;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
}

@media (min-width: 900px) {
    header {
        height: 80px;
        padding: 0 20px;
    }

    .nav-icons {
        gap: 76px; /* увеличено расстояние между иконками */
    }

    .nav-icons a {
        font-size: 22px;
    }
}
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="start.html" class="home">
            <i class="fa-solid fa-house"></i>
            MG
        </a>
    </div>

    <nav class="nav-icons">
        <a href="/visit.html"><i class="fa-solid fa-car"></i></a>
        <a href="/calc.html"><i class="fa-solid fa-calculator"></i></a>
        <a href="/generator.html"><i class="fa-solid fa-key"></i></a>
        <a href="/barcode.html"><i class="fa-solid fa-barcode"></i></a>
        <a href="/map.html"><i class="fa-solid fa-globe"></i></a>
        <a href="/analyzers.html"><i class="fa-solid fa-book"></i></a>
        <a href="/error.html" class="active"><i class="fa-solid fa-triangle-exclamation"></i></a>
        <a href="/calendar.html"><i class="fa-regular fa-calendar"></i></a>
        <a href="/devices.html"><i class="fa-solid fa-computer"></i></a>
    </nav>

    <div class="header-right">
        <button class="logout-btn" id="logout">Выход</button>
    </div>
</header>

<main>

    <div class="error-form">
        <input
            type="text"
            id="errorInput"
            placeholder="Введите код ошибки"
        >

        <select id="deviceSelect"></select>

        <button id="searchBtn">Найти ошибку</button>
    </div>
    <p class="red_status" id="notification"></p>

    <div class="errors-wrapper" id="errorsWrapper"></div>

</main>

<script>
if(localStorage.getItem('isLoggedIn') !== 'true'){
    window.location.href = 'index.html';
}
document.getElementById('logout').onclick = ()=>{
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
};

/* ===== ДАННЫЕ ===== */
const errorsData=[];
const devices = ['Укажите прибор','DxH500','DxH600','DxH800','DxH900','iChem_Velocity','IQ200','AX-4030','BC6800Plus','BC6000/BC6200','BC7**','BC-5000/BC-5150/BC-5120','SC-120','MC-80','CAL8000','BC-20s/BC-30s','UA-5600', 'EH-2090','EU-5600','EU-5300','MT8000'];
function getErrorsList() {
    const url = `https://docs.google.com/spreadsheets/d/16ABEN54Ykbej-PhrbBjGlaHSXzNbD4PA8ecbpWc5QHQ/gviz/tq?gid=1115148661`;
    fetch(url)
    .then(res => res.text())
    .then(rep => {
        const data2 = JSON.parse(rep.substr(47).slice(0,-2));
        const length = data2.table.rows.length;
        for (let i=1; i<length; i+=1) {
            const obj = {
                code: data2.table.rows[i].c[3]?data2.table.rows[i].c[3].v:"",
                altcode: data2.table.rows[i].c[4]?data2.table.rows[i].c[4].v:"",
                device: data2.table.rows[i].c[2]?data2.table.rows[i].c[2].v:"",
                desc: data2.table.rows[i].c[5]? data2.table.rows[i].c[5].v:"",
                action:data2.table.rows[i].c[6]? data2.table.rows[i].c[6].v: "",
                note:data2.table.rows[i].c[7]? data2.table.rows[i].c[7].v:""
            };

        errorsData.push(obj);
        }
        renderErrors();
    })
}
window.onload = getErrorsList();
// Заглушка ошибок
// const errorsData = [
//     {
//         code: "E101",
//         altcode: "E101",
//         device: "DXH-500",
//         desc: "Ошибка инициализации датчика",
//         action: "Перезапустить прибор",
//         note: "Часто после холодного старта"
//     },
//     {
//         code: "E205",
//         altcode: "E205",
//         device: "DXH-500",
//         desc: "Превышение допустимой температуры",
//         action: "Проверить вентиляцию",
//         note: "Возможен перегрев"
//     }
// ];

/* ===== ЭЛЕМЕНТЫ ===== */
const errorInput = document.getElementById("errorInput");
const deviceSelect = document.getElementById("deviceSelect");
const searchBtn = document.getElementById("searchBtn");
const errorsWrapper = document.getElementById("errorsWrapper");

/* ===== SELECT ===== */
devices.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    deviceSelect.appendChild(option);
});

/* ===== URL ===== */
const params = new URLSearchParams(window.location.search);
const errorFromUrl = params.get("error");

if (errorFromUrl) {
    errorInput.value = errorFromUrl;
    setTimeout(()=>{renderErrors()},2000)
}

/* ===== EVENTS ===== */
searchBtn.addEventListener("click", renderErrors);

/* ===== FUNCTIONS ===== */
function renderErrors() {
    errorsWrapper.innerHTML = "";
    document.getElementById("notification").innerText="";
    errorsData.filter((item)=>(item.code.toLowerCase() == errorInput.value.toLowerCase() || item.altcode.toLowerCase() == errorInput.value.toLowerCase())&&(item.device==deviceSelect.value||deviceSelect.value == "Укажите прибор")).length == 0? (deviceSelect.value == "Укажите прибор"&& errorInput.value == ""? document.getElementById("notification").innerText="" : document.getElementById("notification").innerText = "По данным критериям ошибка не найдена. Пожалуйста, предоставьте фото администратору для обновления базы ошибок"): errorsData.filter((item)=>(item.code.toLowerCase() == errorInput.value.toLowerCase())&&(item.device==deviceSelect.value||deviceSelect.value == "Укажите прибор")).forEach(err => {
        const card = document.createElement("div");
        card.className = "error-card";
        card.innerHTML = `
            <p><strong>Код:</strong> ${err.code}</p>
            <p><strong>Прибор:</strong> ${err.device}</p>
            <p><strong>Описание:</strong> ${err.desc}</p>
            <p><strong>Действия:</strong> ${err.action}</p>
            <p><strong>Замечания:</strong> ${err.note}</p>
        `;

        errorsWrapper.appendChild(card);
    });

    errorsWrapper.style.display = "block";
}
</script>

</body>
</html>
